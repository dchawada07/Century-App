name: Century CCPL Journal Voucher Check

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do not save changes"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "29 18 * * *"

jobs:
  journal-voucher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run reconciliation
        env:
          CENTURY_USERNAME: ${{ secrets.CENTURY_USERNAME }}
          CENTURY_PASSWORD: ${{ secrets.CENTURY_PASSWORD }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'true' }}
        run: |
          set -o pipefail
          node automation/journal-voucher-check.mjs 2>&1 | tee journal-voucher-run.log
      - name: Create redacted summary
        if: always()
        shell: bash
        run: |
          if [ -f journal-voucher-run.log ]; then
            sed -E 's/[A-Z]+-[0-9]+/[VOUCHER-REDACTED]/g; s/[0-9]{2}\/[0-9]{2}\/[0-9]{4}/[DATE-REDACTED]/g' journal-voucher-run.log > journal-voucher-redacted.log
          else
            echo "No runner log was produced." > journal-voucher-redacted.log
          fi
      - name: Upload full run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-voucher-full-log-${{ github.run_id }}
          path: journal-voucher-run.log
          if-no-files-found: warn
          retention-days: 90
      - name: Upload redacted run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-voucher-redacted-log-${{ github.run_id }}
          path: journal-voucher-redacted.log
          if-no-files-found: warn
          retention-days: 90
      - name: Publish redacted log to summary
        if: always()
        shell: bash
        run: |
          echo '## Journal Voucher run log (redacted)' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -c 12000 journal-voucher-redacted.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"